<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>RIONetLite · 패킷에서 게임 서버까지</title><!-- STYLES --></head>

<div class="reader-shell"><aside id="sidebar"><label for="search">책 전체 검색</label><input id="search" type="search" placeholder="부분 송신 · session_uid · 설정" maxlength="160" autocomplete="off"><div id="searchResults" role="region" aria-label="검색 결과" hidden></div><nav id="navigation" aria-label="부·장·절 목차"></nav><p class="small">기준 코드 {{COMMIT}}<br>완성 원고 {{PROGRESS}}<br>인터넷 없이 읽는 독립 HTML</p></aside><main id="main" tabindex="-1"><div id="notice" class="notice" role="status" hidden></div><p id="storageStatus" class="small" role="status"></p><!-- CHAPTERS --><nav class="chapter-footer" aria-label="장 이동"><button id="previous">이전 장</button><span id="position"></span><button id="next">다음 장</button></nav></main></div>
